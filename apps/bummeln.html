<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bummeln — Privacy Policy</title>
  <meta name="description" content="Privacy Policy for Bummeln app by Geerah Dev">
  <style>
    :root { --bg: #0b0f14; --card: #121821; --muted:#a7b3c2; --txt:#e6edf3; --accent:#5ad1ff; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #102132 0%, var(--bg) 50%), var(--bg);
      color: var(--txt);
      display:flex; align-items:center; justify-content:center;
      padding: 40px 0;
    }
    .card{
      width:min(860px, 92vw);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1{ margin:0 0 8px; font-size: clamp(28px, 5vw, 44px); letter-spacing: 0.2px; }
    h2{ margin: 32px 0 16px; font-size: clamp(20px, 3.5vw, 28px); color: var(--txt); }
    p{ color: var(--muted); line-height: 1.6; margin: 0 0 16px; font-size: clamp(14px, 2.2vw, 16px); }
    .back-link{
      display:inline-block; margin-bottom:24px; padding:8px 14px; border-radius:10px;
      border:1px solid rgba(255,255,255,0.12);
      text-decoration:none; color:var(--muted); font-size: 14px;
      transition: all 0.2s ease;
    }
    .back-link:hover{
      border-color: rgba(90,209,255,0.6);
      color: var(--txt);
      box-shadow: 0 0 0 2px rgba(90,209,255,0.12) inset;
    }
    .footer{ margin-top:32px; padding-top:24px; border-top: 1px solid rgba(255,255,255,0.08); color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <a class="back-link" href="../index.html">← Back to Home</a>
    <h1>Bummeln</h1>

    <h2>Privacy Policy</h2>
    <p>Bummeln does not collect, store, or share personal data.</p>
    <p>Location data is processed locally on your device and is never transmitted to our servers.</p>
    <p>We do not track users or share data with third parties.</p>

    <div class="footer">© <span id="y"></span> Geerah Dev</div>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
