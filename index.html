<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geerah Dev — App Development, IT Consulting & Digital Media</title>
  <meta name="description" content="Geerah Dev — Apps, websites, software consulting, and digital media.">
  <style>
    :root { --bg: #0b0f14; --card: #121821; --muted:#a7b3c2; --txt:#e6edf3; --accent:#5ad1ff; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #102132 0%, var(--bg) 50%), var(--bg);
      color: var(--txt);
      display:flex; align-items:center; justify-content:center;
    }
    .card{
      width:min(860px, 92vw);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1{ margin:0 0 8px; font-size: clamp(28px, 5vw, 44px); letter-spacing: 0.2px; }
    .tagline{ color: var(--muted); margin:0 0 22px; font-size: clamp(14px, 2.2vw, 18px); }
    .pill{
      display:inline-block; padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.14);
      font-size: 12px; color: var(--muted); margin: 0 8px 8px 0;
    }
    .cta{
      display:inline-block; margin-top:20px; padding:12px 16px; border-radius:12px;
      border:1px solid rgba(255,255,255,0.16);
      text-decoration:none; color:var(--txt);
    }
    .cta:hover{ border-color: rgba(90,209,255,0.6); box-shadow: 0 0 0 3px rgba(90,209,255,0.18) inset; }
    .footer{ margin-top:22px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Geerah Dev</h1>
    <p class="tagline">App development, IT consulting, websites, and digital media.</p>
    <div aria-label="Services">
      <span class="pill">iOS & Android Apps</span>
      <span class="pill">Websites & Web Apps</span>
      <span class="pill">Software Consulting</span>
      <span class="pill">Content & Video</span>
    </div>
    <a class="cta" href="mailto:contact@geerah.dev">contact@geerah.dev</a>
    <div class="footer">© <span id="y"></span> Geerah Dev</div>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
